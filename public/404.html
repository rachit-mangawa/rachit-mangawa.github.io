<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Rachit Mangawa</title>
  <script>
    try {
      var path = window.location.pathname;
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      if (path.indexOf('/rachit-mangawa') === 0) {
        var remaining = path.replace(/^\/rachit-mangawa\/?/, '').replace(/^\/+/, '');
        var dest = '/' + (remaining ? remaining : '') + search + hash;
        window.location.replace(new URL(dest, window.location.origin).href);
      } else {
        var dest = '/' + (hash ? hash : '');
        window.location.replace(new URL(dest, window.location.origin).href);
      }
    } catch (e) {
      window.location.replace('/');
    }
  </script>
</head>
<body>
  <p>Redirecting to <a href="/">rachit-mangawa.github.io</a>...</p>
</body>
</html>
